name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: production-cicd-pipeline
  EC2_INSTANCE_ID: i-03ece06427a7fa0d8

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t production-cicd-pipeline:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: production-cicd-pipeline:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::470829880485:role/GitHubActions-ECR-ProductionCICD
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          docker tag production-cicd-pipeline:ci \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
          AWS_ACCOUNT_ID: "470829880485"
        run: |
          set -euo pipefail

          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          COMMANDS=$(jq -nc --arg image "$IMAGE_URI" '{
            commands: [
              "set -eu",
              "IMAGE_URI=\u0027" + $image + "\u0027",
              "ECR_REGISTRY=470829880485.dkr.ecr.ap-south-2.amazonaws.com",
              "aws ecr get-login-password --region ap-south-2 | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"",
              "docker pull \"$IMAGE_URI\"",

              "OLD_IMAGE=$(docker inspect --format=\"{{.Config.Image}}\" production-cicd-app 2>/dev/null || true)",

              "if [ -z \"$OLD_IMAGE\" ]; then echo No previous container image found; exit 1; fi",

              "echo Previous image: $OLD_IMAGE",
              "echo Stopping current application",
              "docker stop production-cicd-app || true",
              "docker rm -f production-cicd-app || true",

              "HEALTHY=0",
              "if docker run -d --name production-cicd-app --restart unless-stopped -p 127.0.0.1:5000:5000 \"$IMAGE_URI\"; then",
              "  for attempt in $(seq 1 12); do",
              "    if curl --fail --silent http://127.0.0.1:5000/health; then HEALTHY=1; break; fi",
              "    sleep 5",
              "  done",
              "fi",

              "if [ \"$HEALTHY\" -eq 1 ]; then echo New deployment healthy; exit 0; fi",

              "echo New deployment failed; attempting rollback",
              "docker logs --tail 50 production-cicd-app 2>&1 || true",
              "docker rm -f production-cicd-app 2>/dev/null || true",

              "if docker image inspect \"$OLD_IMAGE\" >/dev/null 2>&1 || docker pull \"$OLD_IMAGE\"; then",
              "  docker run -d --name production-cicd-app --restart unless-stopped -p 127.0.0.1:5000:5000 \"$OLD_IMAGE\"",
              "  for attempt in $(seq 1 12); do",
              "    if curl --fail --silent http://127.0.0.1:5000/health; then echo Rollback successful; exit 1; fi",
              "    sleep 5",
              "  done",
              "fi",

              "echo Deployment and rollback failed; manual intervention required",
              "exit 1"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG with rollback support" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment command."
          exit 1
