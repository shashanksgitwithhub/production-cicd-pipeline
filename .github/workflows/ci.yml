name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t production-cicd-pipeline:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: production-cicd-pipeline:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Debug OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::470829880485:role/GitHubActions-ECR-ProductionCICD
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag production-cicd-pipeline:ci $ECR_REGISTRY/production-cicd-pipeline:$IMAGE_TAG
          docker push $ECR_REGISTRY/production-cicd-pipeline:$IMAGE_TAG